networks:
  proteinpro-network:
    driver: bridge

services:
  # ----------------------------------------------------
  # Infrastructure Services
  # ----------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: proteinpro-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
    ports:
      - "3307:3306"
    volumes:
      - ./docker/init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - proteinpro-network

  mongodb:
    image: mongo:7.0
    container_name: proteinpro-mongodb
    restart: always
    ports:
      - "27017:27017"
    networks:
      - proteinpro-network

  kafka:
    image: apache/kafka:3.9.2
    container_name: proteinpro-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - proteinpro-network

  protein-api:
    image: stackroutenew/proteinapi
    container_name: proteinpro-external-api
    restart: always
    ports:
      - "3232:3232"
    networks:
      - proteinpro-network

  # ----------------------------------------------------
  # Core System Management Microservices
  # ----------------------------------------------------
  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: proteinpro-config-server
    restart: always
    ports:
      - "8888:8888"
    networks:
      - proteinpro-network

  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: proteinpro-discovery-server
    restart: always
    ports:
      - "8761:8761"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      - config-server
    networks:
      - proteinpro-network

  # ----------------------------------------------------
  # Domain Microservices
  # ----------------------------------------------------
  authentication-service:
    build:
      context: .
      dockerfile: authentication-service/Dockerfile
    container_name: proteinpro-authentication-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      AUTH_MYSQL_URL: jdbc:mysql://mysql:3306/authentication_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      AUTH_MYSQL_USERNAME: proteinpro_auth
      AUTH_MYSQL_PASSWORD: auth_password_123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: super-secret-jwt-key-minimum-32-characters-long
      INTERNAL_API_KEY: internal-service-secret-key-12345
    depends_on:
      - mysql
      - config-server
      - discovery-server
      - kafka
    networks:
      - proteinpro-network

  user-profile-service:
    build:
      context: .
      dockerfile: user-profile-service/Dockerfile
    container_name: proteinpro-user-profile-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      USER_PROFILE_MYSQL_URL: jdbc:mysql://mysql:3306/user_profile_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      USER_PROFILE_MYSQL_USERNAME: proteinpro_profile
      USER_PROFILE_MYSQL_PASSWORD: profile_password_123
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: super-secret-jwt-key-minimum-32-characters-long
      INTERNAL_API_KEY: internal-service-secret-key-12345
    depends_on:
      - mysql
      - config-server
      - discovery-server
      - kafka
    networks:
      - proteinpro-network

  protein-service:
    build:
      context: .
      dockerfile: protein-service/Dockerfile
    container_name: proteinpro-protein-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      PROTEIN_API_BASE_URL: http://protein-api:3232
    depends_on:
      - protein-api
      - config-server
      - discovery-server
    networks:
      - proteinpro-network

  bookmark-service:
    build:
      context: .
      dockerfile: bookmark-service/Dockerfile
    container_name: proteinpro-bookmark-service
    restart: always
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      BOOKMARK_MONGODB_URI: mongodb://mongodb:27017/proteinpro_bookmarks
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: super-secret-jwt-key-minimum-32-characters-long
    depends_on:
      - mongodb
      - config-server
      - discovery-server
      - kafka
    networks:
      - proteinpro-network

  # ----------------------------------------------------
  # Gateway & Frontend
  # ----------------------------------------------------
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: proteinpro-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_URL: http://discovery-server:8761/eureka/
      JWT_SECRET: super-secret-jwt-key-minimum-32-characters-long
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      - config-server
      - discovery-server
      - authentication-service
      - user-profile-service
      - protein-service
      - bookmark-service
    networks:
      - proteinpro-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proteinpro-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - proteinpro-network
